<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>midi-visuals panel</title>
<style>
  :root {
    --bg: #0e0f13;
    --card: #171920;
    --card-2: #1e212a;
    --line: #2a2e39;
    --text: #e6e8ee;
    --dim: #8b91a1;
    --faint: #5b6070;
    --accent: #7c9cff;
    --accent-2: #4f6fe0;
    --good: #4cd18a;
    --warn: #f0b44c;
    --bad: #ef6464;
    --radius: 10px;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px;
    background: rgba(14, 15, 19, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: 0.2px; }
  header .now { color: var(--dim); }
  header .now b { color: var(--text); font-weight: 600; }
  header .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 99px;
    background: var(--card-2); color: var(--dim); font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.bad { background: var(--bad); }

  main {
    display: grid; gap: 16px; padding: 16px 20px 28px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    max-width: 1280px; margin: 0 auto;
  }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 24px; }
    header { padding: 10px 16px; }
  }
  body.offline main { opacity: 0.45; pointer-events: none; }

  section {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px 16px;
  }
  section > h2 {
    margin: 0 0 12px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--dim);
    display: flex; align-items: center; gap: 8px;
  }
  section > h2 .side { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .hint { color: var(--faint); font-size: 12px; margin: 8px 0 0; }
  .empty { color: var(--faint); font-style: italic; }

  button, select, input[type=text] {
    font: inherit; color: var(--text);
    background: var(--card-2); border: 1px solid var(--line); border-radius: 8px;
  }
  button { padding: 7px 12px; cursor: pointer; transition: background .12s, border-color .12s; }
  button:hover { border-color: var(--faint); }
  button:active { transform: translateY(1px); }
  button.active { background: var(--accent-2); border-color: var(--accent); color: #fff; }
  button.ghost { background: transparent; border-color: transparent; color: var(--dim); padding: 4px 8px; }
  button.ghost:hover { color: var(--text); border-color: var(--line); }
  select, input[type=text] { padding: 7px 10px; width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .grid button { text-transform: capitalize; text-align: left; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions { margin-top: 12px; }
  .info { margin-top: 10px; color: var(--dim); font-family: var(--mono); font-size: 12px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--card-2); padding: 8px 16px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--accent-2); }

  .engines { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .engines button { text-align: left; padding: 8px 10px; }
  .engines small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .engines button.active small { color: #dfe5ff; }
  @media (max-width: 480px) { .engines { grid-template-columns: minmax(0, 1fr); } }

  .field { margin-top: 14px; }
  .field > label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; margin-top: 10px; font-family: var(--mono); }
  .stats b { color: var(--text); font-weight: 500; }
  .error { color: var(--bad); font-size: 13px; margin-top: 10px; }
  .error:empty { display: none; }
  .off-note { color: var(--warn); font-size: 12px; margin-top: 10px; }

  /* Level meter with the gate slider laid over it on the same dB scale. */
  .meter { position: relative; height: 26px; border-radius: 7px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--faint); transition: width .08s linear; }
  .meter .fill.open { background: linear-gradient(90deg, #2f9c64, var(--good)); }
  .meter .gate { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
  .meter input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .scale { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; font-family: var(--mono); margin-top: 4px; }

  .param { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 5px 0; }
  .param .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .param .cc { color: var(--faint); font-family: var(--mono); font-size: 11px; margin-right: 6px; }
  .param .val { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  @media (max-width: 480px) { .param { grid-template-columns: 110px minmax(0, 1fr) 52px; gap: 8px; } }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .extra-title { color: var(--faint); font-size: 12px; margin: 16px 0 4px; }

  /* The controller, laid out like the MPK mini: wheels left, 2 x 4 knobs right. */
  .mpk { display: flex; gap: 14px; padding: 14px 12px 10px; border-radius: 9px; background: #12141a; border: 1px solid var(--line); }
  .wheels { display: flex; gap: 8px; padding-right: 14px; border-right: 1px solid var(--line); }
  .knobs { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 6px; min-width: 0; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center; }
  .ctl .name { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
  .ctl.unused .name { color: var(--faint); font-style: italic; }
  .ctl .val { font-family: var(--mono); font-size: 11px; color: var(--dim); min-height: 15px; }
  .ctl .tag { font-family: var(--mono); font-size: 10px; color: var(--faint); background: transparent; border: 1px dashed transparent; padding: 1px 5px; border-radius: 5px; }
  .ctl .tag:hover { border-color: var(--faint); color: var(--dim); }
  .ctl .tag.learning { color: var(--warn); border-color: var(--warn); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .dial { width: 100%; max-width: 64px; aspect-ratio: 1; cursor: ns-resize; touch-action: none; border-radius: 50%; }
  .dial svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .dial .face { fill: #262a35; stroke: #343947; stroke-width: 1.5; }
  .dial .track { fill: none; stroke: #2b2f3b; stroke-width: 4; stroke-linecap: round; }
  .dial .arc { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
  .dial .ptr { stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
  .unused .dial .arc { stroke: var(--faint); }
  .slot { position: relative; width: 38px; height: 132px; border-radius: 8px; background: #0b0c10; border: 1px solid #343947; cursor: ns-resize; touch-action: none; }
  .slot .mid { position: absolute; left: 4px; right: 4px; top: 50%; border-top: 1px dashed #343947; }
  .slot .thumb { position: absolute; left: 3px; right: 3px; height: 30px; border-radius: 6px;
    background: repeating-linear-gradient(0deg, #4a5060 0 2px, #333846 2px 5px); border: 1px solid #5b6070; }
  .slot .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0 0 7px 7px; background: rgba(124, 156, 255, 0.18); }
  .ctl.hit .dial .face, .ctl.hit .slot { stroke: var(--good); border-color: var(--good); box-shadow: 0 0 10px rgba(76, 209, 138, .35); }
  .dial:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* Pads: one bank of 2 x 4 at a time, pad 1 bottom left like on the MPK. */
  .mpk { flex-wrap: wrap; }
  .pad-box { flex-basis: 100%; order: 3; border-top: 1px solid var(--line); padding-top: 10px; }
  .pad-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pad-head .hint { margin: 0; }
  .pad-head .seg button { padding: 3px 12px; font-size: 12px; }
  .pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 8px; }
  .pad { width: 100%; height: 46px; padding: 4px 6px; border-radius: 7px; font-size: 12px; line-height: 1.15;
    display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; overflow-wrap: anywhere;
    background: color-mix(in srgb, var(--good) calc(var(--lvl, 0) * 70%), #262a35); border-color: #343947; }
  .pad.down { border-color: var(--good); color: #fff; }
  .unused .pad { color: var(--faint); font-style: italic; cursor: default; }
  .ctl.hit .pad { border-color: var(--good); box-shadow: 0 0 10px rgba(76, 209, 138, .35); }
  .layout-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .layout-row .hint { margin: 0; flex: 1; }
  @media (max-width: 480px) {
    .mpk { gap: 8px; padding: 12px 8px 8px; }
    .wheels { gap: 5px; padding-right: 8px; }
    .slot { width: 30px; height: 112px; }
    .knobs { gap: 10px 2px; }
    .ctl .name { font-size: 11px; }
  }

  .presets { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
  .presets li { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .presets li .load { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .save { display: flex; gap: 8px; margin-top: 10px; }
  .save input { flex: 1; }

  .piano { position: relative; height: 70px; border-radius: 6px; overflow: hidden; background: #000; user-select: none; }
  .piano .k { position: absolute; top: 0; }
  .piano .w { height: 100%; background: #e9ebf0; border-right: 1px solid #9aa0ad; }
  .piano .b { height: 60%; background: #1b1d24; border-radius: 0 0 2px 2px; z-index: 1; }
  .piano .w.on { background: var(--accent); }
  .piano .b.on { background: var(--accent-2); box-shadow: 0 0 6px var(--accent); }
  .held { margin-top: 10px; font-family: var(--mono); min-height: 20px; color: var(--text); }

  .log { font-family: var(--mono); font-size: 12px; max-height: 320px; overflow: auto; margin: 0; padding: 0; list-style: none; }
  .log li { padding: 2px 0; border-bottom: 1px solid #1f222b; white-space: pre-wrap; word-break: break-word; }
  .log time { color: var(--faint); margin-right: 8px; }
  .log li.warn { color: var(--warn); }

  .switch { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 16px; height: 16px; }
</style>
</head>
<body class="offline">
<header>
  <h1>midi-visuals</h1>
  <span class="now"><b id="now-sketch">…</b> <span id="now-fps"></span></span>
  <span class="spacer"></span>
  <label class="switch"><input type="checkbox" id="hud"> HUD in window</label>
  <span class="pill"><span class="dot" id="conn-dot"></span><span id="conn">connecting…</span></span>
</header>

<main>
  <div class="col">
    <section>
      <h2>Sketch</h2>
      <div class="grid" id="sketches"></div>
      <div class="row actions" id="actions"></div>
      <div class="info" id="info"></div>
    </section>

    <section>
      <h2>Controller <span class="side hint" id="last-moved"></span></h2>
      <div class="mpk">
        <div class="wheels" id="wheels"></div>
        <div class="knobs" id="knobs"></div>
        <div class="pad-box">
          <div class="pad-head">
            <span class="seg"><button id="bank-a">Bank A</button><button id="bank-b">Bank B</button></span>
            <p class="hint" id="bank-hint"></p>
          </div>
          <div class="pads" id="pads"></div>
        </div>
      </div>
      <div class="layout-row">
        <p class="hint" id="learn-hint"></p>
        <button class="ghost" id="layout-reset" title="Back to the MPK mini defaults">reset layout</button>
      </div>
      <div id="params"></div>
    </section>

    <section>
      <h2>Presets <span class="side hint" id="preset-hint"></span></h2>
      <ul class="presets" id="presets"></ul>
      <form class="save" id="save-form">
        <input type="text" id="save-name" placeholder="Save current knobs as…" maxlength="60">
        <button type="submit">Save</button>
      </form>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>Notes from
        <span class="seg" style="margin-left:6px">
          <button id="src-midi">MIDI</button><button id="src-audio">Audio</button>
        </span>
        <span class="side pill"><span class="dot" id="act-dot"></span><span id="act-label">idle</span></span>
      </h2>
      <div class="piano" id="piano"></div>
      <div class="held" id="held"></div>
      <div class="hint" id="midi-port"></div>
    </section>

    <section>
      <h2>Audio input</h2>
      <div class="field" style="margin-top:0">
        <label for="source">Listen to</label>
        <select id="source"></select>
        <p class="hint" id="source-hint"></p>
      </div>
      <div class="field">
        <label>Pitch engine</label>
        <div class="engines" id="engines"></div>
      </div>
      <div class="field">
        <label>Level and noise gate <span id="gate-val" style="color:var(--text)"></span>
          <span style="color:var(--faint)">· drag to set; notes only count while the level is past the line</span></label>
        <div class="meter">
          <div class="fill" id="meter-fill"></div>
          <div class="gate" id="meter-gate"></div>
          <input type="range" id="gate" min="-90" max="-6" step="1" aria-label="Noise gate in dB">
        </div>
        <div class="scale"><span>-90 dB</span><span>-48</span><span>-6 dB</span></div>
      </div>
      <div class="stats" id="audio-stats"></div>
      <div class="off-note" id="audio-off"></div>
      <div class="error" id="audio-error"></div>
    </section>

    <section>
      <h2>Log <span class="side"><button class="ghost" id="log-clear">clear</button></span></h2>
      <ul class="log" id="log"></ul>
    </section>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (n) => NAMES[n % 12] + (Math.floor(n / 12) - 1);
const ENGINE_INFO = {
  "basic-pitch": "Chords · ~100 ms",
  "swift-f0": "Single notes · fastest",
  "dsp-poly": "Chords · no model, light",
};
const GATE_MIN = -90, GATE_MAX = -6;

let logSeq = 0;
let boot = null;
let online = false;
// Sliders the user is dragging ignore the polled value until shortly after release.
const touched = new Map();
const isTouched = (key) => (touched.get(key) || 0) > performance.now();
const touch = (key) => touched.set(key, performance.now() + 600);

async function send(cmd) {
  try {
    await fetch("/api/cmd", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) });
  } catch (_) { /* the next poll shows we're offline */ }
}

// Coalesce rapid slider moves into one message per animation frame.
const pending = new Map();
function sendSoon(key, cmd) {
  if (!pending.has(key)) requestAnimationFrame(() => { send(pending.get(key)); pending.delete(key); });
  pending.set(key, cmd);
}

// Rebuild a list only when what it shows changes, so focus and hover survive polling.
const shown = {};
function changed(key, value) {
  const sig = JSON.stringify(value);
  if (shown[key] === sig) return false;
  shown[key] = sig;
  return true;
}

function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  for (const c of children) e.append(c);
  return e;
}

// ── Piano ───────────────────────────────────────────────────────────────────
const LOW = 21, HIGH = 108; // A0..C8
const keyEls = new Map();
(function buildPiano() {
  const isBlack = (n) => [1, 3, 6, 8, 10].includes(n % 12);
  const whites = [];
  for (let n = LOW; n <= HIGH; n++) if (!isBlack(n)) whites.push(n);
  const w = 100 / whites.length;
  let wi = 0;
  for (let n = LOW; n <= HIGH; n++) {
    const k = el("div", { title: noteName(n) });
    if (isBlack(n)) {
      k.className = "k b";
      k.style.left = (wi * w - w * 0.32) + "%";
      k.style.width = (w * 0.64) + "%";
    } else {
      k.className = "k w";
      k.style.left = (wi * w) + "%";
      k.style.width = w + "%";
      wi++;
    }
    keyEls.set(n, k);
    $("piano").append(k);
  }
})();

// ── Static controls ─────────────────────────────────────────────────────────
$("src-midi").onclick = () => send({ cmd: "input", audio: false });
$("src-audio").onclick = () => send({ cmd: "input", audio: true });
$("hud").onchange = (e) => send({ cmd: "hud", on: e.target.checked });
$("source").onchange = (e) => send({ cmd: "source", name: e.target.value || null });
$("gate").oninput = (e) => {
  touch("gate");
  const db = Number(e.target.value);
  showGate(db);
  sendSoon("gate", { cmd: "gate", db });
};
$("save-form").onsubmit = (e) => {
  e.preventDefault();
  const name = $("save-name").value.trim();
  if (!name) return;
  send({ cmd: "save_preset", name });
  $("save-name").value = "";
};
$("log-clear").onclick = () => $("log").replaceChildren();

const pct = (db) => Math.max(0, Math.min(1, (db - GATE_MIN) / (GATE_MAX - GATE_MIN))) * 100;
function showGate(db) {
  $("meter-gate").style.left = `calc(${pct(db)}% - 1px)`;
  $("gate-val").textContent = `${Math.round(db)} dB`;
}

// ── Render ──────────────────────────────────────────────────────────────────
let lastState = null;
function render(s, sources) {
  lastState = s;
  const sketch = s.sketches[s.sketch] || "";
  $("now-sketch").textContent = sketch;
  $("now-fps").textContent = `${Math.round(s.fps)} fps`;
  document.title = `${sketch} · midi-visuals`;
  $("hud").checked = s.hud;

  if (changed("sketches", [s.sketches, s.sketch])) {
    $("sketches").replaceChildren(...s.sketches.map((name, i) =>
      el("button", { class: i === s.sketch ? "active" : "", textContent: name, onclick: () => send({ cmd: "sketch", idx: i }) })));
  }
  if (changed("actions", [s.sketch, s.actions])) {
    $("actions").replaceChildren(...s.actions.map((label, i) =>
      el("button", { textContent: label, onclick: () => send({ cmd: "action", idx: i }) })));
  }
  $("info").textContent = s.info || "";

  renderController(s);
  renderParams(s);
  renderPresets(s);
  renderNotes(s);
  renderAudio(s, sources);
}

// Sketch knobs whose CC sits on no control of the layout, as plain sliders.
function renderParams(s) {
  const box = $("params");
  const onLayout = new Set([...s.layout.wheels, ...s.layout.knobs].filter((c) => c.cc !== undefined).map((c) => c.cc));
  const extra = s.params.filter((p) => !onLayout.has(p.cc));
  if (changed("params", [s.sketch, extra.map((p) => [p.cc, p.name])])) {
    box.replaceChildren(...(extra.length ? [el("div", { class: "extra-title", textContent: "Not on the controller" }), ...extra.map((p) => {
      const key = "cc" + p.cc;
      const range = el("input", { type: "range", min: 0, max: 127, step: 1, id: key });
      range.setAttribute("aria-label", p.name);
      range.addEventListener("input", () => {
        touch(key);
        $(key + "-val").textContent = fmt(p.min + (range.value / 127) * (p.max - p.min));
        sendSoon(key, { cmd: "cc", cc: p.cc, value: range.value / 127 });
      });
      return el("div", { class: "param" },
        el("div", { class: "name", title: p.name }, el("span", { class: "cc", textContent: "CC" + p.cc }), p.name),
        range,
        el("div", { class: "val", id: key + "-val" }));
    })] : []));
  }
  for (const p of extra) {
    const key = "cc" + p.cc;
    if (isTouched(key)) continue;
    const r = $(key);
    if (r) r.value = Math.round(p.raw * 127);
    const v = $(key + "-val");
    if (v) v.textContent = fmt(p.min + p.raw * (p.max - p.min));
  }
}

// ── Controller ──────────────────────────────────────────────────────────────
const isPad = (c) => c.pad !== undefined;
const ctlKey = (c) => c === "pitch_bend" ? "pb" : isPad(c) ? "pad" + c.pad : "cc" + c.cc;
const ctlLabel = (c) => c === "pitch_bend" ? "Pitch" : isPad(c) ? "Note " + c.pad : "CC" + c.cc;
const ctlValue = (s, c) => c === "pitch_bend" ? s.pitch_bend : isPad(c) ? (s.pads[c.pad] ?? 0) : (s.ccs[c.cc] ?? 0);
const PADS_PER_BANK = 8;
// Pad slots in grid order: the top row is pads 5-8, the bottom row 1-4.
const PAD_GRID = [4, 5, 6, 7, 0, 1, 2, 3];
const LEARN_HINT = "Drag a knob up or down to turn it, click a pad to hit it. If a control here doesn't match your MPK, click its label and move or hit the real one.";
let padBank = 0;
let ctlEls = [];          // per slot: { control, set(v), root }
let learnSlot = null;     // slot waiting for the next hardware move
let learnFrom = 0;        // control_moves when learning started
let lastMoves = null;
const local = new Map();  // values the page set itself, shown while touched

function setControl(c, v) {
  v = Math.max(0, Math.min(1, v));
  const key = ctlKey(c);
  touch(key);
  local.set(key, v);
  sendSoon(key, c === "pitch_bend" ? { cmd: "bend", value: v } : { cmd: "cc", cc: c.cc, value: v });
  for (const e of ctlEls) if (ctlKey(e.control) === key) e.set(v);
}

// Drag up/down (relative, like a DAW knob), mouse wheel and arrow keys.
function makeDraggable(target, getC, span, springBack) {
  let startY = 0, startV = 0;
  target.addEventListener("pointerdown", (e) => {
    target.setPointerCapture(e.pointerId);
    startY = e.clientY;
    startV = local.get(ctlKey(getC())) ?? target._v ?? 0;
    e.preventDefault();
    target.focus();
  });
  target.addEventListener("pointermove", (e) => {
    if (!target.hasPointerCapture(e.pointerId)) return;
    setControl(getC(), startV + (startY - e.clientY) / span());
  });
  const release = () => { if (springBack()) setControl(getC(), 0.5); };
  target.addEventListener("pointerup", release);
  target.addEventListener("pointercancel", release);
  target.addEventListener("wheel", (e) => {
    e.preventDefault();
    setControl(getC(), (target._v ?? 0) + (e.deltaY < 0 ? 2 : -2) / 127);
  }, { passive: false });
  target.addEventListener("keydown", (e) => {
    const step = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 10, PageDown: -10 }[e.key];
    if (!step) return;
    e.preventDefault();
    setControl(getC(), (target._v ?? 0) + step / 127);
  });
}

const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
// A 270° arc from 7:30 round to 4:30, the travel of a real knob.
function arcPath(r) {
  const p = (deg) => { const a = (deg - 90) * Math.PI / 180; return `${32 + r * Math.cos(a)} ${32 + r * Math.sin(a)}`; };
  return `M ${p(-135)} A ${r} ${r} 0 1 1 ${p(135)}`;
}

function buildKnob(slot, c, label) {
  const track = svg("path", { d: arcPath(29), class: "track" });
  const arc = svg("path", { d: arcPath(29), class: "arc", pathLength: 100 });
  const ptr = svg("line", { x1: 32, y1: 30, x2: 32, y2: 12, class: "ptr" });
  const face = svg("circle", { cx: 32, cy: 32, r: 23, class: "face" });
  const s = svg("svg", { viewBox: "0 0 64 64" });
  s.append(track, arc, face, ptr);
  const dial = el("div", { class: "dial", tabIndex: 0 }, s);
  dial.setAttribute("role", "slider");
  dial.setAttribute("aria-label", label);
  const set = (v) => {
    dial._v = v;
    arc.setAttribute("stroke-dasharray", `${v * 100} 100`);
    ptr.setAttribute("transform", `rotate(${-135 + v * 270} 32 32)`);
    dial.setAttribute("aria-valuenow", Math.round(v * 127));
  };
  makeDraggable(dial, () => c, () => 160, () => false);
  return { dial, set };
}

function buildWheel(slot, c, label) {
  const thumb = el("div", { class: "thumb" });
  const fill = el("div", { class: "fill" });
  const box = el("div", { class: "slot", tabIndex: 0 }, fill, el("div", { class: "mid" }), thumb);
  box.setAttribute("role", "slider");
  box.setAttribute("aria-label", label);
  const set = (v) => {
    box._v = v;
    const h = box.clientHeight || 132;
    thumb.style.bottom = `${v * (h - 34)}px`;
    fill.style.height = c === "pitch_bend" ? "0" : `${v * 100}%`;
    box.setAttribute("aria-valuenow", Math.round(v * 127));
  };
  // The pitch wheel springs back to the middle like the real one.
  makeDraggable(box, () => c, () => (box.clientHeight || 132) - 34, () => c === "pitch_bend");
  return { dial: box, set };
}

function buildPad(padSlot, label) {
  const pad = el("button", { class: "pad", onclick: () => send({ cmd: "pad", slot: padSlot }) });
  pad.setAttribute("aria-label", label);
  const set = (v) => {
    pad.style.setProperty("--lvl", v);
    pad.classList.toggle("down", v > 0);
  };
  return { dial: pad, set };
}

// What a pad slot does: bank A plays the sketch's actions, bank B the app's.
function padAction(s, padSlot) {
  const bank = Math.floor(padSlot / PADS_PER_BANK);
  return (bank === 0 ? s.actions : bank === 1 ? s.app_actions : [])[padSlot % PADS_PER_BANK] || null;
}

function showBank(bank) {
  padBank = bank;
  $("bank-a").classList.toggle("active", bank === 0);
  $("bank-b").classList.toggle("active", bank === 1);
  $("bank-hint").textContent = bank === 0 ? "this sketch's actions" : "app actions, on every sketch";
  const first = lastState ? lastState.layout.wheels.length + lastState.layout.knobs.length : 0;
  ctlEls.slice(first).forEach((e, i) => { e.root.hidden = Math.floor(i / PADS_PER_BANK) !== bank; });
}
$("bank-a").onclick = () => showBank(0);
$("bank-b").onclick = () => showBank(1);

// What a control does in the active sketch: its knob name and scaled value.
function describe(s, c) {
  if (c === "pitch_bend") {
    const used = s.sketches[s.sketch] === "cardano";
    return { name: used ? "hue 2" : "pitch bend", used, fmt: (v) => (v >= 0.5 ? "+" : "") + ((v - 0.5) * 2).toFixed(2) };
  }
  const p = s.params.find((p) => p.cc === c.cc);
  if (p) return { name: p.name, used: true, fmt: (v) => fmt(p.min + v * (p.max - p.min)) };
  if (c.cc === s.scroll_cc) return { name: "presets", used: true, fmt: () => s.presets.length ? `${s.preset + 1}/${s.presets.length}` : "none" };
  return { name: "unused", used: false, fmt: (v) => String(Math.round(v * 127)) };
}

function renderController(s) {
  const slots = [...s.layout.wheels, ...s.layout.knobs, ...s.layout.pads];
  const nw = s.layout.wheels.length, nk = s.layout.knobs.length;
  if (changed("ctl", [s.sketch, s.layout, s.params.map((p) => [p.cc, p.name]), s.presets.length, s.preset, s.actions, s.app_actions])) {
    ctlEls = slots.map((c, i) => {
      if (i >= nw + nk) {
        const padSlot = i - nw - nk;
        const action = padAction(s, padSlot);
        const bank = padSlot < PADS_PER_BANK ? "A" : "B";
        const { dial, set } = buildPad(padSlot, `Pad ${bank}${padSlot % PADS_PER_BANK + 1}: ${action || "unused"}`);
        dial.textContent = action || "–";
        const tag = el("button", {
          class: "tag" + (learnSlot === i ? " learning" : ""),
          textContent: learnSlot === i ? "hit…" : ctlLabel(c),
          title: "Re-map: click, then hit the matching pad on the MPK",
          onclick: () => startLearn(learnSlot === i ? null : i),
        });
        return { control: c, root: el("div", { class: "ctl" + (action ? "" : " unused") }, dial, tag), set };
      }
      const d = describe(s, c);
      const wheel = i < nw;
      const n = wheel ? i + 1 : i - nw + 1;
      const label = `${wheel ? "Wheel" : "Knob"} ${n}: ${d.name}`;
      const { dial, set } = wheel ? buildWheel(i, c, label) : buildKnob(i, c, label);
      const val = el("div", { class: "val" });
      const tag = el("button", {
        class: "tag" + (learnSlot === i ? " learning" : ""),
        textContent: learnSlot === i ? "move…" : ctlLabel(c),
        title: "Re-map: click, then move the matching control on the MPK",
        onclick: () => startLearn(learnSlot === i ? null : i),
      });
      const root = el("div", { class: "ctl" + (d.used ? "" : " unused") }, dial,
        el("div", { class: "name", textContent: d.name, title: d.name }), val, tag);
      return { control: c, root, set: (v) => { set(v); val.textContent = d.fmt(v); } };
    });
    $("wheels").replaceChildren(...ctlEls.slice(0, nw).map((e) => e.root));
    $("knobs").replaceChildren(...ctlEls.slice(nw, nw + nk).map((e) => e.root));
    const pads = ctlEls.slice(nw + nk);
    $("pads").replaceChildren(...[0, 1].flatMap((b) => PAD_GRID.map((j) => pads[b * PADS_PER_BANK + j]).filter(Boolean).map((e) => e.root)));
    showBank(padBank);
    const scroll = s.layout.knobs.findIndex((c) => c.cc === s.scroll_cc);
    $("preset-hint").textContent = scroll >= 0 ? `knob ${scroll + 1} scrolls them too` : `CC ${s.scroll_cc} scrolls them too`;
  }
  for (const e of ctlEls) {
    const key = ctlKey(e.control);
    e.set(isTouched(key) ? local.get(key) : ctlValue(s, e.control));
  }

  // Hardware moves: flash the control, show it, and finish a pending re-map.
  const moved = s.last_control && lastMoves !== null && s.control_moves > lastMoves;
  lastMoves = s.control_moves;
  if (moved) {
    $("last-moved").textContent = `last moved: ${ctlLabel(s.last_control)}`;
    const hitIdx = ctlEls.findIndex((e) => ctlKey(e.control) === ctlKey(s.last_control));
    const hit = ctlEls[hitIdx];
    // A pad hit on the other bank brings that bank into view.
    if (hit && hitIdx >= nw + nk) {
      const bank = Math.floor((hitIdx - nw - nk) / PADS_PER_BANK);
      if (bank !== padBank) showBank(bank);
    }
    if (hit) {
      hit.root.classList.add("hit");
      clearTimeout(hit.root._hit);
      hit.root._hit = setTimeout(() => hit.root.classList.remove("hit"), 300);
    }
    // A pad slot only learns a pad, and a knob or wheel never does.
    if (learnSlot !== null && s.control_moves > learnFrom && (learnSlot >= nw + nk) === isPad(s.last_control)) {
      send({ cmd: "assign", slot: learnSlot, control: s.last_control });
      startLearn(null);
    }
  }
}

function startLearn(slot) {
  learnSlot = slot;
  learnFrom = lastMoves ?? 0;
  delete shown.ctl; // rebuild so the label shows the state
  $("learn-hint").textContent = slot === null
    ? LEARN_HINT
    : "Now move or hit the control that sits in this spot on your MPK… (Esc cancels)";
  if (lastState) renderController(lastState);
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && learnSlot !== null) startLearn(null); });
$("learn-hint").textContent = LEARN_HINT;
$("layout-reset").onclick = () => { startLearn(null); send({ cmd: "reset_layout" }); };

const fmt = (v) => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);

function renderPresets(s) {
  if (!changed("presets", [s.sketch, s.presets, s.preset])) return;
  const list = $("presets");
  if (!s.presets.length) {
    list.replaceChildren(el("li", { class: "empty", textContent: "No presets for this sketch yet." }));
    return;
  }
  list.replaceChildren(...s.presets.map((name, i) => el("li", {},
    el("button", { class: "load" + (i === s.preset ? " active" : ""), textContent: name, title: "Load " + name,
      onclick: () => send({ cmd: "load_preset", idx: i }) }),
    el("button", { class: "ghost", textContent: "✕", title: "Delete " + name,
      onclick: () => { if (confirm(`Delete preset "${name}"?`)) send({ cmd: "delete_preset", idx: i }); } }))));
}

let lastNotes = [];
function renderNotes(s) {
  $("src-midi").classList.toggle("active", !s.audio_on);
  $("src-audio").classList.toggle("active", s.audio_on);
  $("act-dot").className = "dot" + (s.midi_active ? " on" : "");
  $("act-label").textContent = s.midi_active ? "receiving" : "idle";
  for (const n of lastNotes) keyEls.get(n)?.classList.remove("on");
  for (const n of s.notes) keyEls.get(n)?.classList.add("on");
  lastNotes = s.notes;
  $("held").textContent = s.notes.length ? s.notes.map(noteName).join("  ") : "";
  $("midi-port").textContent = s.midi_port
    ? `MIDI port: ${s.midi_port}. Knobs always come from MIDI.`
    : "No MIDI controller connected. Use the knob sliders on the left.";
}

function renderAudio(s, sources) {
  // Source picker: monitors first, since visualising playback is the common case.
  if (changed("sources", [sources, s.source])) {
    const sel = $("source");
    const groups = [
      ["Playing on this computer", sources.filter((x) => x.monitor)],
      ["Microphones and line inputs", sources.filter((x) => !x.monitor)],
    ];
    const opts = [el("option", { value: "", textContent: "System default input" })];
    for (const [label, items] of groups) {
      if (!items.length) continue;
      const g = el("optgroup", { label });
      for (const x of items) g.append(el("option", { value: x.name, textContent: x.description.replace(/^Monitor of /, "") }));
      opts.push(g);
    }
    if (s.source && !sources.some((x) => x.name === s.source)) {
      opts.push(el("option", { value: s.source, textContent: `${s.source} (not available)` }));
    }
    sel.replaceChildren(...opts);
    sel.value = s.source || "";
    $("source-hint").textContent = sources.length
      ? "To visualise music you're playing, pick the output you're listening on under “Playing on this computer”."
      : "Can't list sources (pactl not found). Choose a device with AUDIO_DEVICE=… when starting.";
  }

  if (changed("engines", [s.engines, s.engine])) {
    $("engines").replaceChildren(...s.engines.map((name, i) =>
      el("button", { class: i === s.engine ? "active" : "", onclick: () => send({ cmd: "engine", idx: i }) },
        name, el("small", { textContent: ENGINE_INFO[name] || "" }))));
  }

  if (!isTouched("gate")) {
    $("gate").value = s.gate_db;
    showGate(s.gate_db);
  }
  const a = s.audio;
  const level = a ? a.level_db : GATE_MIN;
  $("meter-fill").style.width = pct(level) + "%";
  $("meter-fill").classList.toggle("open", !!a && level > s.gate_db);

  $("audio-stats").replaceChildren(...(a ? [
    statEl("level", `${level.toFixed(0)} dB`),
    statEl("cpu", `${Math.round(a.load * 100)}%`),
    statEl("latency", `~${Math.round(a.latency_ms)} ms`),
    // A chosen source already shows in the picker above.
    ...(s.source ? [] : [statEl("device", a.device)]),
  ] : []));
  $("audio-off").textContent = s.audio_on ? "" : "Audio capture is off; notes come from MIDI. Switch to Audio above to listen.";
  $("audio-error").textContent = (a && a.engine_error) || s.audio_error || "";
}

const statEl = (k, v) => el("span", {}, k + " ", el("b", { textContent: v }));

function appendLog(lines) {
  if (!lines.length) return;
  const box = $("log");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;
  for (const l of lines) {
    const t = new Date(l.ms).toLocaleTimeString([], { hour12: false });
    box.append(el("li", { class: l.warn ? "warn" : "" }, el("time", { textContent: t }), l.text));
    logSeq = Math.max(logSeq, l.seq);
  }
  while (box.children.length > 300) box.firstChild.remove();
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function setOnline(on) {
  if (on === online) return;
  online = on;
  document.body.classList.toggle("offline", !on);
  $("conn-dot").className = "dot " + (on ? "on" : "bad");
  $("conn").textContent = on ? "connected" : "app not running";
}

async function poll() {
  try {
    const r = await fetch("/api/state?since=" + logSeq, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (boot !== null && data.boot !== boot) {
      // The app restarted: its log starts over, and so does ours.
      $("log").replaceChildren();
      logSeq = 0;
      boot = data.boot;
      return poll();
    }
    boot = data.boot;
    setOnline(true);
    render(data.status, data.sources);
    appendLog(data.log);
  } catch (_) {
    setOnline(false);
  }
  setTimeout(poll, online ? 100 : 1000);
}
poll();
</script>
</body>
</html>
